[package]
name = "warp-openssl"
version = "0.5.4"
edition = "2021"
description = "OpenSSL bindings for Warp TLS server"
license = "MIT"
authors = [
    "Sandeep Bansal <sandeep.bansal85@gmail.com>",
    "René Rössler <rene@freshx.de>",
]
readme = "README.md"
documentation = "https://docs.rs/warp-openssl"
repository = "https://github.com/Azure/warp-openssl"
categories = ["web-programming::http-server"]
keywords = ["warp", "openssl", "tls", "https"]
autotests = true


[features]
openssl-vendored = ["openssl/vendored"]

[dependencies]
tokio-openssl = "0.6"
openssl = { version = "0.10" }
tokio = { version = "1" }
tracing = "0.1"
futures-util = "0.3"
warp = "0.3"
hyper = { version = "0.14", features = [
    "stream",
    "server",
    "http1",
    "http2",
    "tcp",
    "client",
] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["rustls-tls", "native-tls"] }
rstest = "0.26.0"
clap = { version = "4.5.48", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
env_logger = "*"

[[test]]
name = "server"
path = "tests/server.rs"
